<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  *{box-sizing:border-box;}
  :root{--pin:#2e9d68;--accent:#aa1166;--odal:#A01861;--airport:#3470a8;--ic:#1f7a3d;--kok:#7a59c4;
    --ink:#222831;--sub:#5b6570;--mut:#98a2ad;--line:#e6e9ec;--bg:#eef0ec;--panel:#f7f8f6;}
  html,body{margin:0;height:100%;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;}
  #wrap{display:flex;flex-direction:column;height:100vh;height:100dvh;}
  #body{flex:1;display:flex;min-height:0;}
  #map{flex:1;min-width:0;background:#dfe3df;}
  #panel{width:374px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
  #sheetHandle{display:none;}
  #sheetScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;}

  /* 상단바 + 드로어 */
  #topbar{display:flex;align-items:center;gap:10px;padding:9px 16px;padding-top:calc(9px + env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line);flex:none;}
  .tb-brand{font-size:15px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;}
  .tb-brand .bdot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;}
  .tb-menu{margin-left:auto;width:40px;height:40px;border-radius:10px;border:1px solid #e2e6ea;background:#fff;font-size:18px;cursor:pointer;color:#3a424b;line-height:1;display:flex;align-items:center;justify-content:center;}
  .tb-menu:active{background:#f1f3f5;}
  .drawer{position:fixed;top:0;right:-360px;width:320px;max-width:86vw;height:100%;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.22);z-index:5000;transition:right .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
  .drawer.open{right:0;}
  .dr-head{display:flex;align-items:center;justify-content:space-between;padding:18px;padding-top:calc(18px + env(safe-area-inset-top));border-bottom:1px solid #eef0f2;font-weight:800;font-size:15.5px;}
  .dr-head button{border:none;background:none;font-size:19px;cursor:pointer;color:var(--sub);width:34px;height:34px;}
  #drItems{padding:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;}
  .dritem{display:flex;flex-direction:column;gap:3px;padding:15px 16px;border-radius:13px;background:#f6f7f9;font-weight:800;font-size:14.5px;color:var(--ink);text-decoration:none;border:1px solid #eceff2;min-height:44px;justify-content:center;}
  .dritem:active{background:#eef0f3;}
  .dritem .dv{font-weight:600;font-size:12.5px;color:#1a73e8;word-break:break-all;}
  .dritem.tel{background:#fbe9f2;border-color:#f2cfe0;}
  .dritem.tel .dv{color:var(--accent);}
  .drawerbg{position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:4900;opacity:0;pointer-events:none;transition:opacity .26s;}
  .drawerbg.open{opacity:1;pointer-events:auto;}

  /* 지도 핀 */
  .pin{width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);transition:transform .12s;background:var(--pin);}
  .pin.hot{transform:scale(1.6);box-shadow:0 0 0 4px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.5);}
  .pin.sel{background:var(--accent);transform:scale(1.6);box-shadow:0 0 0 5px rgba(170,17,102,.24),0 2px 8px rgba(0,0,0,.5);}
  .leaflet-marker-icon:has(.pin.hot){z-index:1200 !important;}
  .leaflet-marker-icon:has(.pin.sel){z-index:3000 !important;}

  /* 랜드마크 (전용 pane → 주유소 위) */
  .lmdot{width:30px;height:30px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#fff;}
  .lmdot.ic{border-radius:9px;font-weight:800;font-size:13px;}
  .leaflet-tooltip.lmtip{color:#fff;border:none;border-radius:8px;font-weight:800;font-size:13px;padding:5px 11px;box-shadow:0 2px 7px rgba(0,0,0,.3);white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.12);}
  .leaflet-tooltip.lmtip::before{display:none;}
  .leaflet-tooltip.lmpill{color:#fff;border:none;border-radius:9px;font-weight:800;font-size:13px;padding:6px 12px;box-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.12);}
  .leaflet-tooltip.lmpill::before{display:none;}
  .lmtip .lmpill-nm,.lmpill .lmpill-nm{display:block;white-space:nowrap;}
  .lmtip .tt-gmap,.lmpill .tt-gmap{display:none;justify-content:center;align-items:center;gap:5px;margin-top:7px;font-size:11.5px;font-weight:700;white-space:nowrap;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.55);border-radius:7px;padding:6px 9px;text-decoration:none;text-shadow:none;}
  .lmtip.open .tt-gmap,.lmpill.open .tt-gmap{display:flex;}

  /* 주유소 이름표 */
  .leaflet-tooltip.nmtip{background:#3f4751;color:#fff;border:none;border-radius:9px;font-weight:600;font-size:12px;padding:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer;white-space:normal;width:150px;text-align:left;}
  .leaflet-tooltip.nmtip::before{border-top-color:#3f4751;}
  .nmtip .tt-nm{font-weight:800;font-size:12.5px;line-height:1.28;}
  .nmtip .tt-sub{font-size:11px;font-weight:700;margin-top:3px;opacity:.96;}
  .nmtip .tt-cash{color:#ffcf6b;} .nmtip .tt-closed{color:#ffb3b3;}
  .nmtip .tt-tag{font-size:10.5px;font-weight:700;color:#ffd9ec;margin-top:2px;line-height:1.32;}
  .nmtip .tt-more{display:none;}
  .nmtip.sel .tt-more{display:block;margin-top:6px;}
  .nmtip .tt-line{font-size:11px;font-weight:500;line-height:1.4;margin-top:3px;opacity:.96;}
  .nmtip .tt-gmap{display:flex;justify-content:center;align-items:center;gap:5px;margin-top:8px;font-size:11.5px;font-weight:800;white-space:nowrap;color:#1a73e8;background:#fff;border-radius:7px;padding:7px 8px;text-decoration:none;}
  /* 선택 표시: 배경/폰트 서식은 그대로 두고 마젠타 '테두리'로만 강조 */
  .leaflet-tooltip.nmtip.sel{border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(170,17,102,.22),0 6px 18px rgba(0,0,0,.45);}
  .leaflet-tooltip.nmtip.sel:before{display:none !important;}

  /* 줌아웃 시 핀만 (라벨 숨김), 선택된 것만 유지 */
  .pins-only .leaflet-tooltip.nmtip{display:none;}
  .pins-only .leaflet-tooltip.nmtip.sel{display:block;}

  /* 패널 상단 고정(필터) — 한 줄, 목록과 틈 없이 */
  .ptop{position:sticky;top:0;z-index:20;background:var(--panel);padding:10px 12px 8px;}
  .fbar{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .fbar::-webkit-scrollbar{display:none;}
  .fchip{flex:0 0 auto;font-size:12px;font-weight:800;padding:8px 11px;border-radius:18px;border:1px solid #d9dee3;background:#fff;color:var(--sub);cursor:pointer;line-height:1;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;min-height:34px;}
  .fchip:active{background:#f1f3f5;}
  .fchip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .fchip#fopen.on{background:var(--ic);border-color:var(--ic);}
  .fchip svg{width:12px;height:12px;}

  /* 카드 */
  #stationList{padding:8px 12px 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));}
  .scard{background:#fff;border:1px solid #e7eaed;border-radius:14px;padding:13px 15px;margin-bottom:10px;cursor:pointer;transition:box-shadow .12s,border-color .12s,transform .12s;}
  .scard:hover,.scard.active{border-color:#cdd4da;box-shadow:0 4px 14px rgba(20,40,60,.1);}
  .scard.selected{border-color:var(--accent);border-width:2px;background:#fdf2f8;box-shadow:0 6px 18px rgba(170,17,102,.18);}
  .scard .nm{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;line-height:1.3;justify-content:space-between;}
  .nmL{display:flex;align-items:center;gap:8px;min-width:0;}
  .cdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--pin);}
  .scard .dist{font-size:12.5px;font-weight:800;color:#1a73e8;flex:none;}
  .scard .chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
  .chip{font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap;letter-spacing:-.2px;}
  .c-both{background:#e3f3ea;color:#1d7a51;} .c-cash{background:#e0892b;color:#fff;}
  .c-self{background:#e5eefa;color:#2d6cae;} .c-staff{background:#efe7fb;color:#6a44b6;}
  .c-open{background:#eef0f2;color:var(--sub);} .c-closed{background:#d6455e;color:#fff;}
  .scard .hrs{display:flex;align-items:center;gap:6px;font-size:13.5px;color:#3a424b;margin-top:9px;font-weight:700;}
  .scard .note{font-size:12px;color:#8a939d;margin-top:5px;font-weight:600;line-height:1.4;}
  .scard .tag{margin-top:9px;font-size:12px;font-weight:800;color:var(--accent);background:#fbe9f2;border:1px solid #f2cfe0;border-radius:9px;padding:7px 10px;line-height:1.4;}
  .scard .gmap{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:11px;font-size:13.5px;font-weight:800;color:#1a73e8;background:#e8f0fe;border:1px solid #c6dafc;border-radius:9px;padding:11px;text-decoration:none;min-height:44px;}
  .scard .gmap:active{background:#d9e7fd;}
  .fnone{padding:22px 6px;color:var(--mut);font-size:13.5px;text-align:center;font-weight:600;}

  /* 내 위치 + 지도 컨트롤 */
  .meDot{width:13px;height:13px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 4px rgba(26,115,232,.3);}
  .leaflet-tooltip.lmtip.me{background:#1a73e8;}
  .leaflet-control.mapbtns{margin-bottom:12px;margin-right:12px;}
  .mybtn{width:42px;height:42px;border-radius:11px;background:#fff;border:1px solid #d3dae0;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);}
  .mybtn:active{background:#f1f3f5;}
  .mybtn.on{color:#1a73e8;border-color:#1a73e8;}
  .mybtn svg{width:21px;height:21px;}
  .leaflet-control-zoom{border:1px solid #d3dae0 !important;box-shadow:0 2px 8px rgba(0,0,0,.18) !important;border-radius:11px !important;overflow:hidden;margin-right:12px !important;}
  .leaflet-control-zoom a{width:42px !important;height:42px !important;line-height:42px !important;color:var(--sub) !important;font-size:20px !important;background:#fff !important;border-bottom:1px solid #e6e9ec !important;}
  .leaflet-control-zoom a:last-child{border-bottom:none !important;}
  .leaflet-bottom.leaflet-right{margin-bottom:env(safe-area-inset-bottom);}

  @media (max-width:760px){
    #topbar{padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top));gap:8px;}
    .tb-brand{font-size:14px;}
    .tb-menu{width:34px;height:34px;font-size:17px;}
    #body{position:relative;}
    #map{height:100%;width:100%;}
    #panel.sheet{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;background:var(--panel);border:none;border-radius:18px 18px 0 0;box-shadow:0 -6px 26px rgba(0,0,0,.2);z-index:1000;transition:height .2s ease;display:flex;flex-direction:column;overflow:hidden;}
    #sheetHandle{display:flex;justify-content:center;align-items:center;padding:16px 10px;flex:none;cursor:grab;touch-action:none;}
    #sheetHandle .grip{width:52px;height:6px;border-radius:3px;background:#c2c9d1;}
    .ptop{padding:2px 14px 8px;}
    #stationList{padding:8px 14px;padding-bottom:calc(22px + env(safe-area-inset-bottom));}
    .scard{padding:14px 16px;}
    .scard .nm{font-size:16px;}
    .scard .gmap{font-size:14.5px;}
    .leaflet-tooltip.nmtip{font-size:12.5px;width:154px;}
    .leaflet-tooltip.lmtip,.leaflet-tooltip.lmpill{font-size:13px;}
  }

  /* 하단 토스트 알림 */
  #toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);background:#2b313a;color:#fff;font-size:13.5px;font-weight:700;padding:12px 18px;border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.3);max-width:88vw;text-align:center;line-height:1.45;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:9000;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

</style>

<script>
const D = window.GEO_DATA;
(function(){ const r=document.documentElement.style; const mt=D.meta||{};
  if(mt.pinColor) r.setProperty('--pin', mt.pinColor);
  if(mt.accent) r.setProperty('--accent', mt.accent);
  (D.landmarks||[]).forEach(l=>{ if(l.color){ const k={odal:'--odal',airport:'--airport',ic:'--ic',kokusai:'--kok'}[l.kind]; if(k) r.setProperty(k,l.color); } });
})();
const CAR = '<svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11h.5a1.5 1.5 0 0 1 1.5 1.5V18a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5.5A1.5 1.5 0 0 1 4.5 11H5Zm2.2-1h9.6l-1-3H8.2l-1 3ZM6.5 15a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Zm11 0a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Z"/></svg>';
const PLANE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-4.5L21 16Z"/></svg>';
const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7a8590" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>';
const CLOCKSM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>';
const PIN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="#1a73e8"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>';
const PINW = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>';
function nl(t){ return (t==null?'':String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\r?\n/g,'<br>'); }

/* 하단 토스트 알림 (브라우저 기본 alert 대체) */
let _toastTimer = null;
function note(msg){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* 구글맵 URL: 링크가 있으면 그 링크로, 아니면 place_id, 마지막은 좌표 */
function gmapUrl(o){
  const v = (o.pid||'').trim();
  if(/^https?:\/\//i.test(v)) return v;
  if(v) return 'https://www.google.com/maps/search/?api=1&query='+o.lat+','+o.lng+'&query_place_id='+encodeURIComponent(v);
  return 'https://www.google.com/maps/search/?api=1&query='+o.lat+','+o.lng;
}

/* 지도 — 오키나와 인근으로 이동 범위 제한(maxBounds) + 최소 줌 보완 */
const OKINAWA_BOUNDS = L.latLngBounds([[24.0,122.5],[27.5,129.0]]);
const map = L.map("map", { zoomControl:false, maxBounds:OKINAWA_BOUNDS, maxBoundsViscosity:0.85, minZoom:9 }).setView(D.meta.center, D.meta.zoom);
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
  { subdomains:"abcd", maxZoom:19, attribution:'&copy; OpenStreetMap &copy; CARTO' }).addTo(map);
L.control.zoom({ position:"bottomright" }).addTo(map);
/* 랜드마크 전용 pane: 주유소 마커/라벨 위에 오도록 */
map.createPane('lmPane'); map.getPane('lmPane').style.zIndex = 660;
/* 선택된 주유소 전용 pane: 랜드마크보다도 위에 */
map.createPane('selPane'); map.getPane('selPane').style.zIndex = 680;

const LOCSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>';
const LocateCtl = L.Control.extend({ options:{position:"bottomright"}, onAdd:function(){ const d=L.DomUtil.create("div","leaflet-control mapbtns"); const b=L.DomUtil.create("div","mybtn",d); b.innerHTML=LOCSVG; b.title="내 위치"; L.DomEvent.disableClickPropagation(d); L.DomEvent.on(b,"click",function(){ doLocate(b); }); return d; } });
map.addControl(new LocateCtl());

/* 정보 카드 HTML */
/* 지도 핀 위 이름표용 짧은 라벨: s.label 이 있으면 그걸, 없으면 정식명에서
   ／ / ( （ 앞부분만 잘라 쓰고, 그래도 길면 18자에서 줄임 (긴 정식명이 지도를 덮는 문제 방지) */
function mapLabel(s){
  if(s.label) return s.label;
  let t = String(s.short||"").split(/[／/(（]/)[0].trim();
  if(t.length > 18) t = t.slice(0,18).trim() + "…";
  return t;
}
function cardHTML(s){
  const pay = s.pay==="cash" ? '<span class="chip c-cash">현금 ONLY</span>' : '<span class="chip c-both">현금·카드</span>';
  const svc = s.svc==="self" ? '<span class="chip c-self">셀프</span>' : '<span class="chip c-staff">직원 대응</span>';
  const isClosed = s.closed && s.closed!=="연중무휴";
  const closed = `<span class="chip ${isClosed?"c-closed":"c-open"}">${s.closed||"연중무휴"}</span>`;
  const hrs = s.hours ? `<div class="hrs">${CLOCK}${s.hours}</div>` : "";
  const note = s.note ? `<div class="note">${s.note}</div>` : "";
  const tag = s.tag ? `<div class="tag">${s.tag}</div>` : "";
  const gm = `<a class="gmap" href="${gmapUrl(s)}" target="_blank" rel="noopener">${PIN}구글맵에서 보기</a>`;
  return `<div class="nm"><span class="nmL"><span class="cdot ${s.pay}"></span>${nl(s.short)}</span><span class="dist"></span></div>`
       + `<div class="chips">${pay}${svc}${closed}</div>${hrs}${note}${tag}${gm}`;
}

/* 주유소 마커 + 패널 카드 (서로 연동) */
const markers = {}, cards = {};
const panel = document.getElementById("panel");
/* 필터 상태: card=카드가능(현금ONLY 제외), svc=주유방식, open=영업중, sort=거리순 */
const F = { card:false, svc:"all", open:false, sort:false };
let userLL = null, userMarker = null;

panel.innerHTML =
    `<div id="sheetHandle"><div class="grip"></div></div>`
  + `<div id="sheetScroll">`
  +   `<div class="ptop">`
  +     `<div class="fbar" id="fbar">`
  +       `<button class="fchip" id="fopen">${CLOCKSM}영업중</button>`
  +       `<button class="fchip" id="fnear">${PINW}가까운순</button>`
  +       `<button class="fchip" id="fcard">카드 가능</button>`
  +       `<button class="fchip" data-g="svc" data-v="self">셀프</button>`
  +       `<button class="fchip" data-g="svc" data-v="staff">직원 대응</button>`
  +     `</div>`
  +   `</div>`
  +   `<div id="stationList"></div>`
  + `</div>`;
const listEl  = panel.querySelector("#stationList");

let selectedId = null;

/* 마우스 호버가 있는 기기에서만 hot(강조) 적용. 터치 기기는 mouseout 이 안 떠서 hot 이 박히므로 끔 */
const HOVER = !!(window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches);
function setHot(id, on){
  if(!HOVER) return;
  const el = markers[id].getElement();
  if(el){ const d=el.querySelector(".pin"); if(d) d.classList.toggle("hot", on); }
  const tt = markers[id].getTooltip();
  if(tt){ const te = tt.getElement(); if(te) te.classList.toggle("hot", on); }
  if(id!==selectedId) cards[id].classList.toggle("active", on);
}
function setSel(id, on){
  const el = markers[id].getElement();
  if(el){ const d=el.querySelector(".pin"); if(d) d.classList.toggle("sel", on); }
  const tt = markers[id].getTooltip();
  if(tt){ const te = tt.getElement(); if(te){ te.classList.toggle("sel", on);
    const dest = on ? map.getPane('selPane') : map.getPane('tooltipPane');
    if(dest && te.parentNode !== dest) dest.appendChild(te);
  } }
  markers[id].setZIndexOffset(on ? 3000 : 0);
}
function deselect(){
  if(!selectedId) return;
  if(cards[selectedId]) cards[selectedId].classList.remove("selected");
  setSel(selectedId, false);
  selectedId = null;
}
function revealCard(card){
  const sc = panel.querySelector("#sheetScroll");
  if(!sc){ card.scrollIntoView({ behavior:"smooth", block:"center" }); return; }
  const ptop = panel.querySelector(".ptop");
  const ph = ptop ? ptop.offsetHeight : 0;
  const delta = card.getBoundingClientRect().top - sc.getBoundingClientRect().top - ph - 6;
  sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior:"smooth" });
}
function selectStation(id){
  if(id===selectedId){ deselect(); return; }   /* 다시 클릭 → 선택 해제 */
  deselect();
  selectedId = id;
  const card = cards[id];
  card.classList.remove("active");
  card.classList.add("selected");
  setSel(id, true);
  if(window.__expandSheet) window.__expandSheet();
  const panelEl = document.getElementById("panel");
  const mob = panelEl.classList.contains("sheet");
  const ll = markers[id].getLatLng();
  const z = map.getZoom();
  if(mob){
    /* 시트가 가리는 높이의 절반만큼 지도 중심을 남쪽으로 → 핀이 '보이는 영역' 중앙에 표시 */
    const sh = parseInt(panelEl.style.height) || 0;
    const pt = map.project(ll, z); pt.y += sh/2;
    map.setView(map.unproject(pt, z), z, { animate:true });
  } else {
    map.panTo(ll, { animate:true });
  }
  setTimeout(()=>{ if(card.isConnected) revealCard(card); }, 280);  /* 시트 펼침(0.2s) 후 카드 위치로 스크롤 */
}

D.stations.forEach(s=>{
  const m = L.marker([s.lat, s.lng], { draggable:false,
    icon: L.divIcon({ className:"", html:`<div class="pin"></div>`, iconSize:[16,16], iconAnchor:[8,8] })
  });
  const isClosed = s.closed && s.closed!=="연중무휴";
  const payL = s.pay==="cash" ? '<span class="tt-cash">현금 ONLY</span>' : '현금·카드';
  const closedL = isClosed ? `<span class="tt-closed">${s.closed}</span>` : '연중무휴';
  const svcTxt = s.svc==="self" ? '셀프' : '직원 대응';
  const noteL = s.note ? `<div class="tt-line">${s.note}</div>` : '';
  const tagL = s.tag ? `<div class="tt-tag">${s.tag}</div>` : '';
  const ttHtml = `<div class="tt-nm">${nl(mapLabel(s))}</div>`
    + `<div class="tt-sub">${payL} · ${closedL}</div>`
    + `<div class="tt-more">${tagL}<div class="tt-line">${svcTxt} · ${s.hours}</div>${noteL}`
    + `<a class="tt-gmap" href="${gmapUrl(s)}" target="_blank" rel="noopener">${PIN}구글맵에서 보기</a></div>`;
  m.bindTooltip(ttHtml, { permanent:true, interactive:true, direction:"top", offset:[0,-9], opacity:1, className:"nmtip" });
  m.on("mouseover", ()=>setHot(s.id,true));
  m.on("mouseout",  ()=>setHot(s.id,false));
  m.on("click",     ()=>selectStation(s.id));
  /* 이름표 탭 → 마커 click 이 이벤트 부모로 전파되어 selectStation 이 호출됨(중복 리스너 금지).
     단, 구글맵 링크 탭은 선택 토글을 막기 위해 전파만 차단 */
  m.on("tooltipopen", function(e){
    const te = e.tooltip.getElement(); if(!te) return;
    const g = te.querySelector(".tt-gmap");
    if(g && !g._stop){ g._stop = 1; g.addEventListener("click", ev=>ev.stopPropagation()); }
  });
  markers[s.id] = m;

  const card = document.createElement("div");
  card.className = "scard"; card.innerHTML = cardHTML(s);
  card.onmouseenter = ()=>setHot(s.id,true);
  card.onmouseleave = ()=>setHot(s.id,false);
  card.onclick = (e)=>{ if(e.target.closest(".gmap")) return; selectStation(s.id); };
  cards[s.id] = card;
});

/* 영업중 판정 (오키나와=JST 기준) */
function jstNow(){ const n=new Date(); const u=n.getTime()+n.getTimezoneOffset()*60000; const j=new Date(u+9*3600000); return { day:j.getDay(), mins:j.getHours()*60+j.getMinutes() }; }
function isOpenNow(s){ const t=jstNow(); const slot=s.oh && s.oh[t.day]; if(!slot) return false; return t.mins>=slot[0] && t.mins<slot[1]; }

/* 거리 계산 */
function distKm(a,b){ const R=6371,dLa=(b[0]-a[0])*Math.PI/180,dLo=(b[1]-a[1])*Math.PI/180,la1=a[0]*Math.PI/180,la2=b[0]*Math.PI/180; const x=Math.sin(dLa/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function fmtDist(km){ return km<1 ? Math.round(km*1000)+"m" : km.toFixed(1)+"km"; }

/* 목록 렌더 (필터 + 정렬) */
function renderList(){
  let list = D.stations.filter(s =>
       (!F.card || s.pay!=="cash")          /* 카드 가능: 현금 ONLY 제외 */
    && (F.svc==="all" || s.svc===F.svc)
    && (!F.open || isOpenNow(s)) );
  if(F.sort && userLL){ list = list.slice().sort((a,b)=> distKm(userLL,[a.lat,a.lng]) - distKm(userLL,[b.lat,b.lng])); }
  const visible = new Set(list.map(s=>s.id));
  D.stations.forEach(s=>{ const m=markers[s.id]; if(visible.has(s.id)){ if(!map.hasLayer(m)) m.addTo(map); } else if(map.hasLayer(m)) map.removeLayer(m); });
  if(selectedId && !visible.has(selectedId)) deselect();
  listEl.innerHTML = "";
  if(list.length===0){ listEl.innerHTML = '<div class="fnone">조건에 맞는 주유소가 없어요</div>'; }
  list.forEach(s=>{ const c=cards[s.id]; const d=c.querySelector(".dist"); if(d) d.textContent = (F.sort&&userLL)? fmtDist(distKm(userLL,[s.lat,s.lng])) : ""; listEl.appendChild(c); });
}

/* 필터 칩 이벤트 (그룹별 토글) */
const fbar = panel.querySelector("#fbar");
fbar.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="fopen"){ F.open=!F.open; b.classList.toggle("on",F.open); renderList(); return; }
  if(b.id==="fnear"){ doLocate(); return; }   /* 가까운순: 내 위치 파악 후 거리순 정렬(토글) */
  if(b.id==="fcard"){ F.card=!F.card; b.classList.toggle("on",F.card); renderList(); return; }   /* 카드 가능 단일 토글 */
  const g=b.dataset.g, v=b.dataset.v; if(!g) return;
  const was = b.classList.contains("on");
  fbar.querySelectorAll('button[data-g="'+g+'"]').forEach(x=>x.classList.remove("on"));
  if(was){ F[g]="all"; } else { b.classList.add("on"); F[g]=v; }
  renderList();
});

/* 거리순 정렬 상태를 필터 칩(#fnear)과 지도 '내 위치' 버튼에 함께 반영 */
function reflectSort(){
  const nf = document.getElementById("fnear"); if(nf) nf.classList.toggle("on", F.sort);
  const mb = document.querySelector(".mybtn");  if(mb) mb.classList.toggle("on", F.sort);
}
function doLocate(){
  if(F.sort){ F.sort=false; reflectSort(); renderList(); return; }   /* 다시 누르면 거리순 해제 */
  if(!navigator.geolocation){ note("위치 기능을 쓸 수 없어요 (HTTPS 환경에서만 동작합니다)"); return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    userLL=[pos.coords.latitude, pos.coords.longitude];
    if(userMarker){ userMarker.setLatLng(userLL); }
    else { userMarker=L.marker(userLL,{draggable:false,icon:L.divIcon({className:"",html:'<div class="meDot"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map).bindTooltip("내 위치",{permanent:false,direction:"top",className:"lmtip me"}); }
    F.sort=true; reflectSort(); renderList();   /* 기존 순서 무시 → 가까운순 정렬 */
    try{ map.setView(userLL, 14); }catch(e){}
  }, function(){ note("위치를 가져오지 못했어요. 브라우저 위치 권한을 확인해 주세요 (HTTPS에서만 동작)"); }, { enableHighAccuracy:true, timeout:8000, maximumAge:60000 });
}

renderList();

/* 랜드마크 (dot: odal/airport/ic, 그 외: 자동너비 라벨) — 전용 pane에 올려 주유소 위로 */
const lmark = {};
D.landmarks.forEach(l=>{
  const color = l.color || "#7a59c4";
  const gurl = gmapUrl(l);
  const hasLink = !!(l.pid && l.pid.trim());
  const isDot = (l.kind==="odal" || l.kind==="airport" || l.kind==="ic");
  let m, te;
  if(isDot){
    const glyph = l.kind==="odal" ? CAR : (l.kind==="airport" ? PLANE : "IC");
    const dcls = l.kind==="ic" ? "lmdot ic" : "lmdot";
    const icon = L.divIcon({className:"",html:`<div class="${dcls}" style="background:${color}">${glyph}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
    m = L.marker([l.lat, l.lng], { draggable:false, icon, pane:'lmPane', zIndexOffset:1000 }).addTo(map);
    const dir = l.kind==="ic" ? "top" : "right";
    const off = l.kind==="ic" ? [0,-9] : [11,0];
    let tip, opts = { permanent:true, direction:dir, offset:off, opacity:1, pane:'lmPane', className:"lmtip" };
    if(hasLink){ tip = `<span class="lmpill-nm">${nl(l.name)}</span><a class="tt-gmap" href="${gurl}" target="_blank" rel="noopener">${PINW}구글맵에서 보기</a>`; opts.interactive = true; }
    else { tip = `<span class="lmpill-nm">${nl(l.name)}</span>`; }
    m.bindTooltip(tip, opts);
    te = m.getTooltip().getElement();
    if(te){ te.style.background = color; }
  } else {
    const icon = L.divIcon({className:"lm-empty",html:"",iconSize:[1,1],iconAnchor:[0,0]});
    m = L.marker([l.lat, l.lng], { draggable:false, icon, pane:'lmPane', zIndexOffset:1000 }).addTo(map);
    let tip;
    if(hasLink){ tip = `<span class="lmpill-nm">${nl(l.name)}</span><a class="tt-gmap" href="${gurl}" target="_blank" rel="noopener">${PINW}구글맵에서 보기</a>`; }
    else { tip = `<span class="lmpill-nm">${nl(l.name)}</span>`; }
    m.bindTooltip(tip, { permanent:true, interactive:hasLink, direction:"center", opacity:1, pane:'lmPane', className:"lmpill" });
    te = m.getTooltip().getElement();
    if(te){ te.style.background = color; }
  }
  if(hasLink && te){ te.addEventListener("click", (e)=>{ if(e.target.closest(".tt-gmap")) return; te.classList.toggle("open"); }); }
  lmark[l.id] = m;
});

/* 상단바 + 드로어(메뉴) */
(function(){
  const brand = document.getElementById("tbText");
  if(brand) brand.textContent = (D.meta && D.meta.brand) || "ODAL 근처 주유소";
  const items = document.getElementById("drItems");
  const menu = (D.meta && D.meta.menu) || [];
  if(items){
    items.innerHTML = menu.map(function(mi){
      if(mi.type==="tel"){ const dial=String(mi.value||"").replace(/[^+0-9]/g,""); return `<a class="dritem tel" href="tel:${dial}">${nl(mi.label)}<span class="dv">${nl(mi.value)}</span></a>`; }
      let v = (mi.value||"").trim();
      // 보안: http/https/앵커(#) 외 스킴(javascript: 등) 차단
      if(!/^(https?:\/\/|#|\/)/i.test(v)) v = "#";
      v = v.replace(/"/g,"&quot;");
      return `<a class="dritem" href="${v}" target="_blank" rel="noopener">${nl(mi.label)}<span class="dv">바로가기 →</span></a>`;
    }).join("");
  }
  const dr = document.getElementById("drawer"), bg = document.getElementById("drawerbg");
  function open(){ dr.classList.add("open"); bg.classList.add("open"); }
  function close(){ dr.classList.remove("open"); bg.classList.remove("open"); }
  const mb=document.getElementById("menuBtn"); if(mb) mb.onclick=open;
  const dc=document.getElementById("drClose"); if(dc) dc.onclick=close;
  if(bg) bg.onclick=close;
})();

/* 모바일 바텀시트 (높이 조절 바 + 스냅) */
(function(){
  const mq = window.matchMedia("(max-width:760px)");
  const panelEl = document.getElementById("panel");
  const handle = document.getElementById("sheetHandle");
  const bodyEl = document.getElementById("body");
  function bodyH(){ return (bodyEl ? bodyEl.clientHeight : window.innerHeight) || 500; }
  function snaps(){ const h=bodyH(); return { peek:100, half:Math.round(h*0.5), full:Math.round(h*0.86) }; }
  let cur = "peek";
  function setSheet(state, px){ const s=snaps(); let h = (px!=null) ? px : s[state]; h=Math.max(s.peek, Math.min(s.full, h)); panelEl.style.height=h+"px"; if(px==null && state) cur=state; }
  function applyMobile(){ if(mq.matches){ panelEl.classList.add("sheet"); setSheet("peek"); } else { panelEl.classList.remove("sheet"); panelEl.style.height=""; panelEl.style.transition=""; } setTimeout(function(){ map.invalidateSize(false); }, 60); }
  applyMobile();
  if(mq.addEventListener) mq.addEventListener("change", applyMobile); else if(mq.addListener) mq.addListener(applyMobile);
  window.addEventListener("resize", function(){ if(mq.matches) setSheet(cur); });
  let dragging=false, startY=0, startH=0, moved=false;
  function down(e){ if(!mq.matches) return; dragging=true; moved=false; startY=(e.touches?e.touches[0].clientY:e.clientY); startH=panelEl.getBoundingClientRect().height; panelEl.style.transition="none"; }
  function move(e){ if(!dragging) return; const y=(e.touches?e.touches[0].clientY:e.clientY); const dy=startY-y; if(Math.abs(dy)>2) moved=true; setSheet(null, startH+dy); if(e.cancelable) e.preventDefault(); }
  function up(){ if(!dragging) return; dragging=false; panelEl.style.transition=""; const s=snaps(); const h=panelEl.getBoundingClientRect().height;
    if(!moved){ cur=(cur==="peek"?"half":"peek"); setSheet(cur); return; }
    const opts=[["peek",s.peek],["half",s.half],["full",s.full]]; let best=opts[0], bd=1e9;
    opts.forEach(function(o){ const d=Math.abs(o[1]-h); if(d<bd){ bd=d; best=o; } });
    cur=best[0]; setSheet(cur);
  }
  if(handle){
    handle.addEventListener("mousedown", down);
    handle.addEventListener("touchstart", down, {passive:false});
  }
  window.addEventListener("mousemove", move);
  window.addEventListener("touchmove", move, {passive:false});
  window.addEventListener("mouseup", up);
  window.addEventListener("touchend", up);
  window.__expandSheet = function(){ if(mq.matches && cur==="peek"){ cur="half"; setSheet("half"); } };
})();

/* 줌 레벨에 따른 라벨 표시: 줌아웃=핀만, 줌인=상세 라벨 */
const LABEL_ZOOM = 14;
function applyZoomMode(){ map.getContainer().classList.toggle("pins-only", map.getZoom() < LABEL_ZOOM); }
map.on("zoomend", applyZoomMode);

/* 모든 핀이 보이도록 맞춤 (오달 중심 부근, 전체 줌아웃) */
function fitAll(){
  const pts = [];
  D.stations.forEach(s=> pts.push(markers[s.id].getLatLng()));
  D.landmarks.forEach(l=> pts.push(lmark[l.id].getLatLng()));
  if(pts.length){
    const panelEl = document.getElementById("panel");
    if(panelEl && panelEl.classList.contains("sheet")){
      /* 모바일 첫 화면: 좌·하단 여백을 더 크게 → 핀 묶음이 살짝 오른쪽·위로 치우침 */
      map.fitBounds(L.latLngBounds(pts), { paddingTopLeft:[58,24], paddingBottomRight:[22,86], maxZoom:15, animate:false });
    } else {
      map.fitBounds(L.latLngBounds(pts), { padding:[45,45], maxZoom:15, animate:false });
    }
  }
  applyZoomMode();
}
/* 모바일에서 지도가 잘못된 크기로 초기화되는 문제(오른쪽 미표시·클릭 어긋남·과도 줌) 해결 */
function hardRefresh(){ map.invalidateSize(false); fitAll(); }
hardRefresh();
requestAnimationFrame(hardRefresh);
setTimeout(hardRefresh, 120);
setTimeout(hardRefresh, 350);
window.addEventListener("load", function(){ setTimeout(hardRefresh, 80); });
window.addEventListener("orientationchange", function(){ setTimeout(hardRefresh, 250); });
/* 지도 컨테이너 크기가 바뀔 때마다(시트 펼침/회전/창 크기) 자동 재계산 — 보던 화면은 유지(invalidateSize만) */
if(window.ResizeObserver){
  let rt;
  new ResizeObserver(function(){ clearTimeout(rt); rt=setTimeout(function(){ map.invalidateSize(false); }, 80); }).observe(document.getElementById("map"));
} else {
  window.addEventListener("resize", function(){ map.invalidateSize(false); });
}

</script>
